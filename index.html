<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema de Controle - Stok</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>

  <!-- TELA DE AUTENTICAÇÃO (LOGIN / REGISTRO) -->
  <div id="auth-container" class="container">
    <div class="card">
      <h2 id="auth-title">Entrar no Sistema</h2>
      <form id="auth-form">
        <div class="input-group">
          <label for="usuario">Usuário</label>
          <input type="text" id="usuario" required autocomplete="username">
        </div>
        <div class="input-group">
          <label for="senha">Senha</label>
          <input type="password" id="senha" required autocomplete="current-password">
        </div>
        <button type="submit" id="auth-btn" class="btn primary">Entrar</button>
      </form>
      <p id="auth-toggle-text">
        Não tem uma conta? <a href="#" id="toggle-mode">Cadastre o primeiro usuário</a>
      </p>
      <div id="auth-error" class="error-msg"></div>
    </div>
  </div>

  <!-- TELA PRINCIPAL DO SISTEMA (DASHBOARD) -->
  <div id="app-container" class="container hidden">
    <header>
      <h1>Controle de Estoque</h1>
      <div class="user-info">
        <span>Logado como: <strong id="current-user-name"></strong></span>
        <button id="logout-btn" class="btn danger sm">Sair</button>
      </div>
    </header>

    <main>
      <!-- Seção de Cadastro de Produtos -->
      <section class="card">
        <h3>Adicionar Novo Produto</h3>
        <form id="produto-form" class="inline-form">
          <input type="text" id="prod-nome" placeholder="Nome do produto" required>
          <input type="number" id="prod-preco" placeholder="Preço (R$)" step="0.01" min="0" required>
          <input type="number" id="prod-qtd" placeholder="Quantidade" min="0" required>
          <button type="submit" class="btn success">Cadastrar Produto</button>
        </form>
      </section>

      <!-- Lista de Produtos -->
      <section class="card">
        <h3>Produtos em Estoque</h3>
        <div class="table-responsive">
          <table>
            <thead>
              <tr>
                <th>Nome</th>
                <th>Preço</th>
                <th>Quantidade</th>
                <th>Ações</th>
              </tr>
            </thead>
            <tbody id="produtos-tbody">
              <!-- Preenchido via JavaScript -->
            </tbody>
          </table>
        </div>
      </section>
    </main>
  </div>

  <script src="./script.js"></script>
</body>
</html>
